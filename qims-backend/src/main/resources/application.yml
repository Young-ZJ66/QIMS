server:
  port: 8080

spring:
  application:
    name: qims-backend

  # MySQL 8.0 配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/qims_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: 1234

  # 文件上传大小限制
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

# MyBatis 配置
mybatis:
  mapper-locations: classpath*:com/young/mapper/**/*Mapper.xml
  type-aliases-package: com.young.pojo
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# PageHelper 分页插件配置
pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true

# 自定义应用配置
qims:
  # JWT 签名密钥
  jwt:
    secret: qims-default-jwt-secret-key-please-change-in-production-2024
    expire-hours: 24
  # CORS 允许的来源（逗号分隔）
  cors:
    allowed-origins: http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173

# springdoc-openapi 配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  packages-to-scan: com.young.controller

# Knife4j 增强
knife4j:
  enable: true
  setting:
    language: zh_cn
