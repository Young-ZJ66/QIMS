server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: qims-backend

  lifecycle:
    timeout-per-shutdown-phase: 30s

  # MySQL 8.0 配置（生产环境通过环境变量覆盖）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/qims_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # 文件上传大小限制
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

# MyBatis 配置
mybatis:
  mapper-locations: classpath*:com/young/mapper/**/*Mapper.xml
  type-aliases-package: com.young.pojo
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# PageHelper 分页插件配置
pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true

# 自定义应用配置
qims:
  # 文件上传目录
  upload:
    dir: ${UPLOAD_DIR:./uploads}
  # JWT 签名密钥（生产环境必须通过环境变量配置强密钥）
  jwt:
    secret: ${JWT_SECRET:qims-default-jwt-secret-key-please-change-in-production-2024}
    expire-hours: ${JWT_EXPIRE_HOURS:24}
  # CORS 允许的来源（逗号分隔）
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}

# springdoc-openapi 配置（生产环境禁用）
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  packages-to-scan: com.young.controller

# Knife4j 增强（生产环境通过 profile 禁用）
knife4j:
  enable: ${KNIFE4J_ENABLE:true}
  setting:
    language: zh_cn

# Actuator 健康检查
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

# 日志配置
logging:
  level:
    com.young: info
    org.springframework.web: warn
  pattern:
    dateformat: yyyy-MM-dd HH:mm:ss.SSS
